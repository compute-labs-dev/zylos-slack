display_information:
  name: CL Codex Monitor
  description: Event-driven, read-only engineering Slack triage
  background_color: "#1d1c1d"
features:
  bot_user:
    display_name: CL Codex Monitor
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write
      - groups:history
      - reactions:write
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - message.groups
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
